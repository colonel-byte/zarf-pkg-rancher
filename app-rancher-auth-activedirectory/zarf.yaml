# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: app-rancher-auth-activedirectory
  description: "Active Directory auth for Rancher, with no plaintext bind password in the manifest"
  version: "1.0.0"

documentation:
  prerequisites: docs/prerequisites.yaml
  schema: ../schema/zarf-v1alpha1-package-prerequisites-schema.json

variables:
  - name: AD_SERVERS
    description: Domain controller hostname or IP
    prompt: true
  - name: AD_SERVICE_ACCOUNT_USERNAME
    description: "UPN or DN of the bind user, e.g. bind@example.com"
    prompt: true
  - name: AD_USER_SEARCH_BASE
    description: Base DN to search users under
    prompt: true
  - name: AD_PORT
    description: LDAP port
    default: "389"
  - name: AD_TLS
    description: true to use LDAPS on the port above
    default: "false"
  - name: AD_GROUP_SEARCH_BASE
    description: Base DN to search groups under; Rancher falls back to the user search base when empty
    default: ""
  - name: AD_DEFAULT_LOGIN_DOMAIN
    description: NetBIOS domain prepended to bare usernames at login
    default: ""
  # prompt: false because Zarf prompts per package and not per selected component, and
  # the `secret` component is optional: prompting would demand a password that an
  # out-of-band deploy does not need. Pass it with --set.
  - name: AD_SERVICE_ACCOUNT_PASSWORD
    description: "secret component only: password of the bind user"
    default: ""
    sensitive: true

components:
  # The Secret is declared first so it exists before the AuthConfig that references it,
  # and is optional: deselecting it is how an out-of-band Secret works. The AuthConfig is
  # byte-identical either way, because the reference it carries is a constant.
  - name: secret
    required: false
    description: "The serviceAccountPassword for activedirectory, in the Secret Rancher reads it from"
    manifests:
      - name: activedirectory-secret
        files:
          - manifests/secret.yaml

  - name: authconfig
    required: true
    description: "The activedirectory AuthConfig, enabled, referencing the Secret above"
    manifests:
      - name: activedirectory
        files:
          - manifests/authconfig.yaml
