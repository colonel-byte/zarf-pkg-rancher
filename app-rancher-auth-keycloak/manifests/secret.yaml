---
# The name and the key are both derived, not chosen: Rancher's
# common.CreateOrUpdateSecrets names the Secret <lowercased authconfig type>-<lowercased
# field> and stores the value under <lowercased field>. ReadFromSecret looks for exactly
# that. A different name is read back fine but the secretmigrator writes to this one, so a
# custom name produces intermittent login failures (rancher/rancher#56110).
#
# Exactly one key. The OIDC read path iterates the whole data map instead of looking the
# key up, so a second key makes the client secret nondeterministic.
apiVersion: v1
kind: Secret
metadata:
  name: keycloakoidcconfig-clientsecret
  namespace: cattle-global-data
type: Opaque
stringData:
  clientsecret: "###ZARF_VAR_OIDC_CLIENT_SECRET###"
