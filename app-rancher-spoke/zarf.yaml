# yaml-language-server: $schema=https://raw.githubusercontent.com/zarf-dev/zarf/main/zarf.schema.json
kind: ZarfPackageConfig
metadata:
  name: app-rancher-spoke
  description: Registers an existing air-gapped cluster with a hub Rancher, with the images Rancher then pulls downstream
  version: "2.15.2"

documentation:
  prerequisites: docs/prerequisites.yaml
  # Packaged too, so the document can be validated where the tarball is opened.
  schema: ../schema/zarf-v1alpha1-package-prerequisites-schema.json

variables:
  # prompt: false because Zarf prompts per package and not per selected component, and
  # `register` is optional: prompting would demand an import URL that a mirror-only run
  # does not need. Pass it with --set. It carries the cluster token, hence sensitive.
  - name: RANCHER_IMPORT_URL
    description: "register component only: the hub's import URL, https://<hub>/v3/import/<token>_<cluster>.yaml"
    default: ""
    sensitive: true
  - name: IMPORT_CURL_OPTS
    description: "register component only: extra curl options, e.g. --cacert /etc/ssl/hub-ca.pem or -k"
    default: ""

components:
  # Images only. Nothing here renders a manifest: these are the images *Rancher* creates
  # pods for once the cluster is registered, so the Zarf agent rewrites them to this
  # cluster's registry and they must be in the package or they ImagePullBackOff.
  - name: agent
    required: true
    description: "The images every imported cluster pulls: cluster agent, downstream webhook and its helm-op pod, Fleet agent"
    images:
      # cattle-cluster-agent, the only container in the hub's import manifest.
      - docker.io/rancher/rancher-agent:v2.15.2
      # The rancher-webhook chart, which the cluster agent installs in *this* cluster.
      - docker.io/rancher/rancher-webhook:v0.11.3
      # The helm-operation pod that performs that install, here and not on the hub.
      - docker.io/rancher/shell:v0.8.2
      # fleet-agent in cattle-fleet-system, deployed by the hub's Fleet controller.
      - docker.io/rancher/fleet-agent:v0.16.2

  - name: version-management
    required: false
    description: "Only if the hub manages this cluster's Kubernetes version: the system-upgrade-controller chart"
    images:
      - docker.io/rancher/system-upgrade-controller:v0.20.1
      # The chart's kubectl container. Its tag tracks the SUC chart, not Rancher.
      - docker.io/rancher/kuberlr-kubectl:v8.1.1

  # The upgrade jobs the SUC plans run, one component per Kubernetes minor: a minor you
  # will not upgrade to is dead weight. Needs version-management to be any use.
  - name: k8s-1-34
    required: false
    images:
      - docker.io/rancher/k3s-upgrade:v1.34.11-k3s1
      - docker.io/rancher/rke2-upgrade:v1.34.11-rke2r1

  - name: k8s-1-35
    required: false
    images:
      - docker.io/rancher/k3s-upgrade:v1.35.8-k3s1
      - docker.io/rancher/rke2-upgrade:v1.35.8-rke2r1

  - name: k8s-1-36
    required: false
    images:
      - docker.io/rancher/k3s-upgrade:v1.36.4-k3s1
      - docker.io/rancher/rke2-upgrade:v1.36.4-rke2r1

  # Last, so the images are in the registry before the agent that needs them starts.
  - name: register
    required: false
    description: "Applies the hub's import manifest, joining this cluster to the hub"
    actions:
      onDeploy:
        after:
          # Rancher's own import command, which is curl piped into kubectl. kubectl ships
          # with the Zarf binary, so the only thing this host needs is curl.
          - cmd: |
              test -n "###ZARF_VAR_RANCHER_IMPORT_URL###" || {
                echo "RANCHER_IMPORT_URL is unset: deploy with --set RANCHER_IMPORT_URL=https://<hub>/v3/import/<token>_<cluster>.yaml" >&2
                exit 1
              }
              curl -sfL ###ZARF_VAR_IMPORT_CURL_OPTS### "###ZARF_VAR_RANCHER_IMPORT_URL###" | ./zarf tools kubectl apply -f -
